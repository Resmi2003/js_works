<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- tw cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fontawesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="w-full h-full bg-white flex justify-center items-center mt-[80px]">

    <div class="bg-gray-300/50 w-[380px] h-[535px] rounded-[20px]">
        <div class="mx-[150px] mt-10 border border-gray-500 h-[78px] w-[80px] rounded-[50%]"><i
                class="fa-solid fa-building-columns text-6xl"></i></div>
        <h3 class="text-2xl font-bold text-black text-center mt-4">My Bank</h3>

        <!-- reg-username -->
        <input id="reg-username" type="text"
            class="w-[300px] h-[45px] bg-white rounded-[20px] ml-[39px] mt-7 pl-5 text-xl text-gray-900"
            placeholder="Username">

        <!-- reg-acc -->
        <input id="reg-acc" type="text"
            class="w-[300px] h-[45px] bg-white rounded-[20px] ml-[39px] mt-6 pl-5 text-xl text-gray-900"
            placeholder="Account number">

        <!-- reg-pass -->
        <input id="reg-pass" type="password"
            class="w-[300px] h-[45px] bg-white rounded-[20px] ml-[39px] mt-6 pl-5 text-xl text-gray-900"
            placeholder="Password">

        <!-- registerUser -->
        <div class="text-center"><button onclick="registerUser()"
                class="bg-blue-500 text-white hover:text-black w-[300px] h-[45px] text-lg rounded-[20px] mt-8 font-bold">Register</button>
        </div>

        <!-- goToLoginFromRegister -->
        <div class="text-center"><button onclick="goToLoginFromRegister()"
                class="text-blue-600 w-[300px] h-[45px] text-base mt-3">Sign in</button></div>
    </div>

</body>

<!-- js cdn -->
<script src="./script.js"></script>

</html>
