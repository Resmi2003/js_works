<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Checker</title>
    <!-- tw cdn -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-full w-full bg-teal-300 flex justify-center items-center">

    <div class="w-[350px] h-[250px] bg-white mt-[40px] border border-black border-[2px] rounded-[5px]">
        <h1 class="text-3xl font-semibold text-center mt-[30px]">Age Checker</h1>
        <input id="ageValue" class="w-[320px] h-[30px] border border-blue-700 ms-auto me-auto ml-[13px] mt-[40px]"></input>
        <div class="text-center mt-[50px]"><button onclick="ageChecker()" class="w-[57px] h-[30px] border-indigo-600 bg-indigo-600 text-white rounded-[4px]">Check</button>
</div>
    </div>

    <script>  // in the html code, for input we put an id. also for button put onclick.
        function ageChecker(){
            const userAge = document.getElementById('ageValue').value;  // if not put value then only that code will appear in console.if put value, then value will get.
            console.log(userAge);
            
            if(userAge>=18){
                alert("you are eligible");
            }
            else{
                alert("you are not eligible");
            }
            
        }
    </script>

    
</body>
</html>
