<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <!-- tw cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fontawesome cdn -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
</head>
<body>

    <h1 class="text-blue-600 text-3xl font-semibold text-center mt-[35px]">Product List</h1>

    <table class="border-[5px] ml-[40px] w-[228px] h-[300px] border-blue-600 border-collapse">
        <tr class="border-b-[2px] border-blue-600">
            <th class="text-left">Id</th>
            <th class="text-left px-1">Product</th>
            <th class="text-left px-1">Action</th>
        </tr>

        <tr class="border-b-[2px] border-blue-600">
            <td class="border-r-[2px] border-blue-600">200043</td>
            <td class="border-r-[2px] border-blue-600"><img class="h-[100px] w-[90px] ms-auto me-auto" src="./images/camera blur.jpeg" alt=""></td>
            <td><button onclick="btnClick()"><div class="h-[28px] w-[30px] border border-black border-[3px] ml-[0.5px]"><i class="fa-solid fa-trash"></i></div></button></td>
        </tr>

        <tr>
            <td class="border-r-[2px] border-blue-600">200043</td>
            <td class="border-r-[2px] border-blue-600"><img class="h-[100px] w-[90px] ms-auto me-auto" src="./images/camera blur.jpeg" alt=""></td>
            <td><button onclick="btnClick()"><div class="h-[28px] w-[30px] border border-black border-[3px] ml-[0.5px]"><i class="fa-solid fa-trash"></i></div></button></td>
        </tr>
    </table>

    <script>
        function btnClick(){
            let action = confirm("Are you sure you want to perform this action?");

            if(action==true){
                console.log("User confirmed the action.");
                
            }
            else{
                console.log("User cancelled the action.");
                
            }

        }
        
    </script>

    
    
</body>
</html>
