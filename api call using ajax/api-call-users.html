<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Call using AJAX</title>
    <!-- tw cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="h-full w-full">

    <h1 class="text-blue-700 text-center font-bold text-3xl mt-[40px]">Users Data</h1>

    <center>
        <table class="border border-3 border-blue-700 mt-[20px]">
            <thead>
                <tr>
                    <th class="border border-3 border-blue-700 p-3">Id</th>
                    <th class="border border-3 border-blue-700 p-3">Name</th>
                    <th class="border border-3 border-blue-700 p-3">Username</th>
                    <th class="p-3">Email</th>
                </tr>
            </thead>
            
<!-- id="result" below is to store result -->
            <tbody id="result"></tbody>

        </table>

    </center>


    <!-- js code -->
    <script>

        // AJAX API CALL
        // 1. Create a new XMLHTTPRequest Object
        const response = new XMLHttpRequest();


         // 2. Connect to API Call  
         response.open('get','https://jsonplaceholder.typicode.com/users');


         // 3. Send
         response.send();


         // 4. Set OnreadystateChange
         response.onreadystatechange = () => {

            if(response.readyState==4){
                if(response.status>199 && response.status<300){
                    // console.log(response.responseText);
                    const usersArray = JSON.parse(response.responseText);
                    // console.log(usersArray);
                    displayData(usersArray);
                }
            }
         }


         // 5. Display array of data into the browser
         function displayData(usersArray){
         for(let user of usersArray){    
                htmlData = `  <tr>         
                    <td class="border border-3 border-blue-700">${user.id}</td>   
                    <td class="border border-3 border-blue-700">${user.name}</td>
                    <td class="border border-3 border-blue-700">${user.username}</td>
                    <td class="border border-3 border-blue-700">${user.email}</td>
                    </tr>  `


                    result.innerHTML += htmlData; 
            }
        }
        













        </script>
