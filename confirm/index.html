<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm</title>
</head>
<body>

    <script>
        let dlt = confirm("Are you confirm about delete it"); // true or false   // returns boolean
        console.log(dlt);  // confirm() – Shows a message and wait for the user to press ok or cancel. Returns true for ok and false for cancel.


        
    </script>
    
</body>
</html>
