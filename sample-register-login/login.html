<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>

<h2>Login</h2>

<input id="luser" type="text" placeholder="Username"><br><br>
<input id="lpass" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<script>
function login() {
    let username = luser.value;
    let password = lpass.value;

    // validation
    if (username === "" || password === "") {
        alert("Please enter all fields");
        return;
    }

    // check login
    if (localStorage.getItem(username) === password) {
        alert("Login successful");
    } else {
        alert("Invalid username or password");
    }

    // clear inputs
    luser.value = "";
    lpass.value = "";
}
</script>

</body>
</html>
