<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async-Await</title>
    <!-- tw cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="w-full h-full">

    <h1 class="mt-5 text-black text-5xl text-center font-bold">Post Details</h1>

    <!-- display result -->
     <div id="card-container"></div>

     <!-- js code -->
     <script>

        async function fetchPost() {
            try{
                const response = await fetch('https://jsonplaceholder.typicode.com/posts');
                console.log(response);
                const data = await response.json();        // asynchronous function useyyumbo ulla time delay handle cheyyan useyyunnathanu await.
                return data;
                
            }catch(error){
                console.error("error",error);
                throw error;

            }
        }

       //  fetchPost()     // comment fetchPost



       async function displayPost() {
        const posts = await fetchPost();
       //  console.log(posts);
       const cardContainer = document.getElementById('card-container');
       const cardsHtml = posts.map(post=>
        ` <div class="w-full h-full mt-10">
            <div class="w-[80%] ml-[150px]">
                <h5 class="text-2xl text-center font-bold">${post.title}</h5>
                <p class="text-base text-center border border-black border-2">${post.body}</p>
                </div>
                </div>        
        `
       ).join('')   // if we need to make the appearance as 3 columns if we have 2 column. also removes coma. // .join is used to separate or join an element.
       cardContainer.innerHTML = cardsHtml;
       }

       displayPost()



     </script>
    
</body>
</html>
