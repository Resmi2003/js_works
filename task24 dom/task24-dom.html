<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>

    <h1 id="head">DOM getElementsByTagName()</h1>

    <p>This is the first paragraph.</p>
    <p>This is the second paragraph.</p>
    <p>This is the third paragraph.</p>

    <button class="btn" onclick="changeColor()">Use Tag</button>

    <script>


        // getElementById()
        const documentId = document.getElementById('head')
        console.log(documentId);
        documentId.style.color = "green"


         // querySelector()
        const querybtn = document.querySelector('.btn')
        console.log(querybtn);

        // getElementsByTagName()
        function changeColor(){
            let tag = document.getElementsByTagName('p')

            for(let ch of tag){
                ch.style.color = "blue"
                ch.style.backgroundColor = "pink"
            }
        }
        
        
    </script>
    
</body>
</html>
