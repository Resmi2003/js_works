<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <center>
        <table class="border border-3 border-blue-700 mt-[20px]">
            <thead>
                <tr>
                    <th class="border border-3 border-blue-700 p-3">userId</th>
                    <th class="border border-3 border-blue-700 p-3">id</th>
                    <th class="border border-3 border-blue-700 p-3">title</th>
                    <th class="border border-3 border-blue-700 p-3">completed</th>
                </tr>
            </thead>

            <tbody id="result"></tbody>
        </table>
    </center>

    <script>

        //1. fetch
        fetch('https://jsonplaceholder.typicode.com/todos')
        // .then(data=>console.log(data))
        .then(data=>(data.json()))
        .then(todos=>displayContent(todos))

        .catch(err=>console.log(err))
        

        // 2. display content into html
        function displayContent(todos){
            for(let todo of todos){
                htmlData = `
                     <tr>
                        <td class="border border-3 border-blue-700 p-3">${todo.userId}</td>
                        <td class="border border-3 border-blue-700 p-3">${todo.id}</td>
                        <td class="border border-3 border-blue-700 p-3">${todo.title}</td>
                        <td class="border border-3 border-blue-700 p-3">${todo.completed}</td>
                        </tr>
                `

                result.innerHTML += htmlData;
            }
        }




    </script>
