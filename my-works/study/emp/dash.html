<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- tw cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>

<body class="h-full w-full bg-orange-300">

    <div class="flex justify-between">
        <!-- head1 -->
        <h1 id="head1" class="text-3xl text-black font-semibold mt-[20px] ml-[20px]">Welcome user</h1>
        <button onclick="logout()" class="w-[70px] h-[40px] bg-red-500 text-white font-semibold rounded-[5px] mt-[20px] mr-[20px]">Logout</button>
    </div>



    
                <input id="empid" type="text" placeholder="Employee Id"
                    class="mt-[20px] pl-[10px] w-[420px] h-[35px] ml-[45px] rounded-[3px] bg-white text-gray-900"></input><br>
                <input id="empname" type="text" placeholder="Employee Name"
                    class="mt-[20px] pl-[10px] w-[420px] h-[35px] ml-[45px] rounded-[3px] bg-white text-gray-900"></input><br>
                <input id="empaddr" type="text" placeholder="Employee Address"
                    class="mt-[20px] pl-[10px] w-[420px] h-[35px] ml-[45px] rounded-[3px] bg-white text-gray-900"></input><br>
                <input id="empdesg" type="text" placeholder="Employee Designation"
                    class="mt-[20px] pl-[10px] w-[420px] h-[35px] ml-[45px] rounded-[3px] bg-white text-gray-900"></input><br>
                <input id="empexp" type="text" placeholder="Employee Experience"
                    class="mt-[20px] pl-[10px] w-[420px] h-[35px] ml-[45px] rounded-[3px] bg-white text-gray-900"></input><br>
                <input id="empsal" type="text" placeholder="Employee Salary"
                    class="mt-[20px] pl-[10px] w-[420px] h-[35px] ml-[45px] rounded-[3px] bg-white text-gray-900"></input><br>

                <button onclick="addEmployee()" class="mt-[20px] pl-[10px] w-[420px] h-[35px] ml-[45px] rounded-[3px] border text-center border-blue-900 text-blue-900 font-semibold">Add
                    Employee</button>
            </div>
        </div>

        <div>
            <!-- emp -->
            <input id="emp" type="text" placeholder="Search Id"
                class="mt-[20px] pl-[10px] w-[420px] h-[35px] ml-[45px] rounded-[3px] bg-white text-gray-900"></input><br>

            <button onclick="search()" class="w-[60px] h-[40px] bg-blue-700 text-white ml-[50px] mt-[20px] rounded-[5px] font-semibold">Search</button>

            <div id="result"></div>

        </div>
    </div>
<input id="removing" type="text" placeholder="remove id"
                class="mt-[20px] pl-[10px] w-[420px] h-[35px] ml-[60px] rounded-[3px] bg-white text-gray-900"></input><br>


                <button onclick="remove()" class="w-[60px] h-[40px] bg-blue-700 text-white ml-[50px] mt-[30px] rounded-[5px] font-semibold">remove</button>




    <script>

        const welcome = document.getElementById('head1');
         let username = localStorage.getItem('uname');
        welcome.innerHTML = `welcome ${username}`;


        function logout(){
            localStorage.clear();

            window.location = './emp.html';
        }


         function addEmployee(){

            /// here 
            
      var employee = {
            id : empid.value,
            name : empname.value,
            address : empaddr.value,
            desg : empdesg.value,
            exp : empexp.value,
            sal : empsal.value
        }

        if(employee.id in localStorage){
            alert("employee already exist");

        }
              

        else{
            localStorage.setItem(employee.id,JSON.stringify(employee));
            alert('employee details created successfully');

        }


        document.getElementById('empid').value = "";



         }



         function search(){
            let key = emp.value;
            if(key===""){
                alert("enter key")
                return;
                emp.value = "";
            }
            let employee = JSON.parse(localStorage.getItem(key));
            if(employee===null){
                alert("doesnt ex")
                
                emp.value = "";
                return
            }

           var htmlData = `
            <table class="mt-[40px] ml-[500px] border border-2 border-blue-700 w-[500px]">
                <thead>
                    <tr>
                        <th class="border border-2 border-blue-700 p-3">id</th>

                        <th class="border border-2 border-blue-700 p-3">name</th>

                        <th class="border border-2 border-blue-700 p-3">address</th>

                        <th class="border border-2 border-blue-700 p-3">desg</th>

                        <th class="border border-2 border-blue-700 p-3">exp</th>

                        <th class="border border-2 border-blue-700 p-3">sala</th>
                        </tr>
                    
                     </thead>

                    <tbody>
                        <tr>
                        <td class="border border-2 border-blue-700 p-3">${employee.id}</td>

                        <td class="border border-2 border-blue-700 p-3">${employee.name}</td>

                        <td class="border border-2 border-blue-700 p-3">${employee.address}</td>

                        <td class="border border-2 border-blue-700 p-3">${employee.desg}</td>

                        <td class="border border-2 border-blue-700 p-3">${employee.exp}</td>


                        <td class="border border-2 border-blue-700 p-3">${employee.sal}</td>
                        </tr>

                        </tbody>

                    
                </table>







            `


            result.innerHTML = htmlData;


            document.getElementById('emp').value = "";


           

         }



         function remove(){
            let key = removing.value;
            localStorage.removeItem(key);
            alert("removed")
         }







    </script>
    
</body>
</html>
