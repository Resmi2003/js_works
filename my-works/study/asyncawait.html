<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <center>
        <table class="border border-3 border-blue-700 mt-[20px]">
            <thead>
                <tr>
                    <th class="border border-3 border-blue-700 p-3">userId</th>
                    <th class="border border-3 border-blue-700 p-3">id</th>
                </tr>
            </thead>

            <tbody id="result"></tbody>
        </table>
    </center>

    <script>

        async function fetchPost(){
            try{
                const response = await fetch('https://jsonplaceholder.typicode.com/posts');
                console.log(response);
                const data = await response.json();
                return data;
                
            }
            catch(error){
                console.error("error",error);
                throw error;
                

            }
        }

        // fetchPost()


        async function displayPost(){
            const posts = await fetchPost();
            console.log(posts);

            for(let post of posts){
        htmlData = `
                    <tr>
                        <td class="border border-3 border-blue-700 p-3">${post.userId}</td>
                        <td class="border border-3 border-blue-700 p-3">${post.id}</td>
                    </tr>
        `

        result.innerHTML += htmlData;
            
        }
    }

    displayPost()





    </script>
