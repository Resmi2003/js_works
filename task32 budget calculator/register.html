<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <!-- tw cdn -->
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-pink-400 flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-xl w-[90%] max-w-5xl p-8">

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-pink-600">Smart Wallet</h1>
      <p class="text-gray-600">Steering Family Finances as One</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-10 items-center">

      <div class="flex justify-center">
        <img src="./images/budget.jpeg" alt="Finance Illustration" class="max-w-sm w-full">
      </div>

      <div>
        <h2 class="text-2xl font-semibold text-center mb-6 text-gray-700">
          Register
        </h2>

        <form class="space-y-4">

            <!-- uname -->
          <input id="uname" type="text" placeholder="Username"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400">

            <!-- email -->
            <input id="email" type="email" placeholder="Email Id"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400">

            <!-- password -->
           <input id="password" type="password" placeholder="Password"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400">

            <!-- register -->
          <button onclick="register()" type="button" class="w-full bg-pink-500 text-white py-3 rounded-lg font-semibold hover:bg-pink-600 transition">
            Register
          </button>
        </form>

        <p class="text-center mt-4 text-gray-600">
          Already have an account?
          <a href="./login.html" class="text-pink-600 font-semibold">Login</a>
        </p>
      </div>

    </div>
  </div>

</body>

<!-- js cdn -->
 <script src="./register.js"></script>

</html>
