<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt</title>
</head>
<body>

    <script>
        var country = prompt("Enter your country");  // prompt() – Used to take user input as string => input=prompt(“hi”,”no”)  // prompt() is that question box. Prompt is a pop-up input box that asks a question and returns the user’s input as a string. Even if you type 25, it is "25". When user clicks Cancel Returned value → null
        console.log(country); // india


        if(country=='' || country.length==0){
            console.log("you entered nothing");
            
        }
        else{
            console.log("you entered" + country);
            
            
            
        }
        
    </script>
    
</body>
</html>
